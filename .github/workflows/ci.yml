name: CI

on:
  push:

jobs:
  # clang-format at the version in tools/clang-format/version.txt, the same as on a PC
  format-check:
    name: Check code formatting
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install clang-format
        run: tools/clang-format/run.sh --version
      - name: Check code formatting
        run: tools/clang-format/check.sh

  tests:
    name: Run the tests on native_sim
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      # gcc-multilib: native_sim is 32-bit, like the boards
      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build gperf device-tree-compiler gcc-multilib g++-multilib
      - name: Set up the west workspace (Zephyr version from west.yml)
        run: tools/setup.sh
      - name: Build and run the tests with Twister
        run: |
          source tools/env.sh
          west twister -T tests -p native_sim --outdir twister-out --inline-logs
      - name: Upload the test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tests-report
          path: twister-out/twister.xml
          retention-days: 3
